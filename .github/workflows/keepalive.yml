# Keeps Render free-tier services awake so Discord Activities don't get 502 on cold start.
# Note: GitHub schedule is often delayed (~hourly). Prefer Render Cron / UptimeRobot every 5m.
name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Wake Activity + movies backend
        run: node scripts/keepalive.mjs
